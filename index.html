<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papatya Falı</title>
  <meta name="description" content="Papatya Falı: kahve falı, tarot, burç yorumları ve daha fazlası.">
  <style>
    :root { --bg: #0a0a1a; --card: #15132b; --gold: #d4af37; --text: #f3efe2; --muted: #b9b3c9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, var(--bg) 60%); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
    main { max-width: 520px; width: 100%; background: var(--card); border: 1px solid rgba(212,175,55,.35);
      border-radius: 20px; padding: 32px 24px; text-align: center; }
    .logo { font-size: 56px; line-height: 1; }
    h1 { margin: 12px 0 8px; font-size: 28px; color: var(--gold); letter-spacing: .5px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    .btn { display: inline-block; background: linear-gradient(135deg, #ffe082, #d4af37, #927118); color: #120524;
      text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 14px; }
    nav { margin-top: 28px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 14px; }
    nav a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🌼</div>
    <h1>Papatya Falı</h1>
    <p>Kahve falı, tarot, burç yorumları, rüya tabirleri ve daha fazlası tek uygulamada.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=app.emergent.fateanalyzera0966d9a">Google Play'den indir</a>
    <nav>
      <a href="https://www.termsfeed.com/live/992f262b-416f-434b-8020-1fda164a9c47">Gizlilik Politikası</a>
      <a href="mailto:ugurulasbayrak@gmail.com">İletişim</a>
    </nav>
  </main>
</body>
</html>
